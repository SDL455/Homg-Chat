name: flutter_chat_app_playable
description: Playable chat app (offline demo mode) with optional Firebase switch. GetX + clean repos.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  get: ^4.6.6
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.2.0
  firebase_messaging: ^15.1.2
  flutter_local_notifications: ^17.2.3
  image_picker: ^1.1.2
  flutter_chat_core: ^2.8.0
  flutter_chat_ui: ^2.9.0
  shared_preferences: ^2.2.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
